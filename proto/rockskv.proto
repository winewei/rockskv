syntax = "proto3";
package rockskv;
option go_package = "github.com/example/rockskv/pkg/proto";

// KVService - Compute 层对外暴露的服务
service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc BatchGet(BatchGetRequest) returns (BatchGetResponse);
  rpc BatchPut(BatchPutRequest) returns (BatchPutResponse);
}

// StorageService - Storage 内部服务
service StorageService {
  rpc Get(StorageGetRequest) returns (StorageGetResponse);
  rpc Put(StoragePutRequest) returns (StoragePutResponse);
  rpc Delete(StorageDeleteRequest) returns (StorageDeleteResponse);
  rpc BatchPut(StorageBatchPutRequest) returns (StorageBatchPutResponse);
  rpc ExportSST(ExportSSTRequest) returns (stream SSTChunk);
  rpc IngestSST(stream SSTChunk) returns (IngestSSTResponse);
}

// MetadataService - 元数据服务
service MetadataService {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetRouteTable(GetRouteTableRequest) returns (GetRouteTableResponse);
  rpc SubscribeRouteUpdates(SubscribeRequest) returns (stream RouteUpdate);

  // Cluster lifecycle APIs
  rpc GetClusterInfo(GetClusterInfoRequest) returns (GetClusterInfoResponse);
  rpc InitCluster(InitClusterRequest) returns (InitClusterResponse);

  // Migration APIs
  rpc TriggerRebalance(TriggerRebalanceRequest) returns (TriggerRebalanceResponse);
  rpc GetMigrationStatus(GetMigrationStatusRequest) returns (GetMigrationStatusResponse);
  rpc CancelMigration(CancelMigrationRequest) returns (CancelMigrationResponse);

  // Partition Lease APIs (for split-brain prevention)
  rpc AcquirePartitionLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  rpc RenewPartitionLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc RevokePartitionLease(RevokeLeaseRequest) returns (RevokeLeaseResponse);
}

// ========== KVService 消息定义 ==========

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  bool success = 1;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  bool success = 1;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
  bool found = 3;
}

message BatchGetRequest {
  repeated bytes keys = 1;
}

message BatchGetResponse {
  repeated KeyValue items = 1;
}

message BatchPutRequest {
  repeated KeyValue items = 1;
}

message BatchPutResponse {
  bool success = 1;
  int32 count = 2;
}

// ========== StorageService 消息定义 ==========

message StorageGetRequest {
  bytes key = 1;
  uint32 partition_id = 2;
}

message StorageGetResponse {
  bytes value = 1;
  bool found = 2;
  ErrorCode error = 3;
}

message StoragePutRequest {
  bytes key = 1;
  bytes value = 2;
  uint32 partition_id = 3;
}

message StoragePutResponse {
  bool success = 1;
  ErrorCode error = 2;
}

message StorageDeleteRequest {
  bytes key = 1;
  uint32 partition_id = 2;
}

message StorageDeleteResponse {
  bool success = 1;
  ErrorCode error = 2;
}

message StorageBatchPutRequest {
  repeated KeyValue items = 1;
  uint32 partition_id = 2;
}

message StorageBatchPutResponse {
  bool success = 1;
  int32 count = 2;
  ErrorCode error = 3;
}

message ExportSSTRequest {
  uint32 partition_id = 1;
  int64 bandwidth_limit = 2;  // Bytes per second, 0 for unlimited
}

message SSTChunk {
  bytes data = 1;
  string filename = 2;
  bool is_last = 3;
  uint32 partition_id = 4;
  int64 total_size = 5;       // Total size of this partition's data
  int64 offset = 6;           // Current offset for progress tracking
}

message IngestSSTResponse {
  bool success = 1;
  int64 keys_ingested = 2;
  int64 bytes_ingested = 3;
}

// ========== 错误码 ==========

enum ErrorCode {
  OK = 0;
  PARTITION_NOT_FOUND = 1;
  PARTITION_MOVED = 2;
  KEY_NOT_FOUND = 3;
  INTERNAL_ERROR = 4;
}

// ========== MetadataService 消息定义 ==========

message RegisterNodeRequest {
  string node_id = 1;
  string addr = 2;
  NodeRole role = 3;
}

message RegisterNodeResponse {
  bool success = 1;
}

message HeartbeatRequest {
  string node_id = 1;
}

message HeartbeatResponse {
  bool success = 1;
  uint64 route_version = 2;
}

message GetRouteTableRequest {
  uint64 version = 1;
}

message GetRouteTableResponse {
  RouteTable route_table = 1;
}

message SubscribeRequest {
  string node_id = 1;
}

message RouteUpdate {
  uint64 version = 1;
  repeated PartitionInfo partitions = 2;
}

message RouteTable {
  repeated PartitionInfo partitions = 1;
  uint64 version = 2;
}

message PartitionInfo {
  uint32 partition_id = 1;
  string primary = 2;
  string replica = 3;
  PartitionStatus status = 4;
  // Migration fields
  string migration_target = 5;  // Target node during migration
  MigrationState migration_state = 6;
}

// ========== 枚举类型 ==========

enum ClusterState {
  CLUSTER_PENDING = 0;      // Cluster just started, no partitions
  CLUSTER_INITIALIZING = 1; // Partition allocation in progress
  CLUSTER_RUNNING = 2;      // Partitions allocated, serving requests
}

enum NodeRole {
  STORAGE = 0;
  COMPUTE = 1;
  METADATA = 2;
}

enum PartitionStatus {
  NORMAL = 0;
  MIGRATING_OUT = 1;
  MIGRATING_IN = 2;
  OFFLINE = 3;
}

enum MigrationState {
  MIGRATION_NONE = 0;
  MIGRATION_PREPARING = 1;    // Creating snapshot
  MIGRATION_COPYING = 2;      // Transferring SST data
  MIGRATION_CATCHUP = 3;      // Catching up incremental writes
  MIGRATION_SWITCHING = 4;    // Switching route
  MIGRATION_COMPLETE = 5;     // Migration done
  MIGRATION_FAILED = 6;       // Migration failed
}

// ========== Migration 消息定义 ==========

message TriggerRebalanceRequest {
  bool force = 1;  // Force rebalance even if already balanced
  int64 bandwidth_limit = 2;  // Bytes per second, 0 for default
  int32 max_concurrent = 3;   // Max concurrent partition migrations, 0 for default
}

message TriggerRebalanceResponse {
  bool success = 1;
  string message = 2;
  string migration_id = 3;
  int32 partitions_to_migrate = 4;
}

message GetMigrationStatusRequest {
  string migration_id = 1;  // Empty for current migration
}

message GetMigrationStatusResponse {
  bool in_progress = 1;
  string migration_id = 2;
  int64 start_time = 3;
  int32 total_partitions = 4;
  int32 completed_partitions = 5;
  int32 failed_partitions = 6;
  int64 bytes_copied = 7;
  int64 bytes_total = 8;
  double progress_percent = 9;
  int64 estimated_remaining_seconds = 10;
  repeated PartitionMigrationStatus partition_status = 11;
}

message PartitionMigrationStatus {
  uint32 partition_id = 1;
  string source_node = 2;
  string target_node = 3;
  MigrationState state = 4;
  int64 bytes_copied = 5;
  int64 bytes_total = 6;
  double progress_percent = 7;
  string error_message = 8;
}

message CancelMigrationRequest {
  string migration_id = 1;
}

message CancelMigrationResponse {
  bool success = 1;
  string message = 2;
}

// ========== Cluster Lifecycle 消息定义 ==========

message GetClusterInfoRequest {}

message GetClusterInfoResponse {
  ClusterState state = 1;
  int32 replica_count = 2;
  int32 storage_node_count = 3;
  int32 partition_count = 4;
}

message InitClusterRequest {}

message InitClusterResponse {
  bool success = 1;
  string message = 2;
  int32 partition_count = 3;
  int32 node_count = 4;
}

// ========== Partition Lease 消息定义 ==========

message AcquireLeaseRequest {
  uint32 partition_id = 1;
  string node_addr = 2;
}

message AcquireLeaseResponse {
  bool success = 1;
  int64 lease_id = 2;
  string message = 3;
}

message RenewLeaseRequest {
  int64 lease_id = 1;
}

message RenewLeaseResponse {
  bool success = 1;
  string message = 2;
}

message RevokeLeaseRequest {
  int64 lease_id = 1;
}

message RevokeLeaseResponse {
  bool success = 1;
}
