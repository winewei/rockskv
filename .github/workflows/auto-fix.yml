name: Auto Fix CI Failures

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  auto-fix:
    name: Auto Fix with Claude
    runs-on: ubuntu-latest
    # Only run on failure and not on main/master branches
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.head_branch != 'master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_branch }}
        fetch-depth: 0

    - name: Get failed workflow logs
      id: get-logs
      uses: actions/github-script@v7
      with:
        script: |
          const jobs = await github.rest.actions.listJobsForWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.payload.workflow_run.id
          });

          let failedLogs = '';
          for (const job of jobs.data.jobs) {
            if (job.conclusion === 'failure') {
              try {
                const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id
                });
                failedLogs += `\n=== ${job.name} ===\n${logs.data.slice(-5000)}`;
              } catch (e) {
                failedLogs += `\n=== ${job.name} ===\nFailed to get logs: ${e.message}`;
              }
            }
          }

          // Truncate to avoid token limits
          const truncated = failedLogs.slice(-10000);
          core.setOutput('logs', truncated);
          return truncated;

    - name: Run Claude Code to fix issues
      id: claude-fix
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        prompt: |
          CI workflow failed. Please analyze the error logs and fix the issues.

          Failed workflow: ${{ github.event.workflow_run.name }}
          Branch: ${{ github.event.workflow_run.head_branch }}

          Error logs:
          ```
          ${{ steps.get-logs.outputs.logs }}
          ```

          Instructions:
          1. Analyze the error logs to understand what failed
          2. Fix the code issues (type errors, missing imports, API compatibility, etc.)
          3. Do NOT modify unrelated files
          4. Make minimal changes to fix the specific errors
          5. After fixing, verify the fix compiles with: CGO_ENABLED=0 go build -tags=nocgo ./...
        allowed_tools: "Read,Edit,Write,Bash,Glob,Grep"
        max_turns: 10

    - name: Check for changes
      id: check-changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push fixes
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        git config user.name "Claude Auto-Fix"
        git config user.email "claude-auto-fix@users.noreply.github.com"
        git add -A
        git commit -m "fix: Auto-fix CI failures

        Automatically fixed by Claude Code based on CI error logs.

        Workflow: ${{ github.event.workflow_run.name }}
        Run: ${{ github.event.workflow_run.html_url }}"
        git push origin ${{ github.event.workflow_run.head_branch }}
