version: "2"

run:
  timeout: 5m
  go: "1.21"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    staticcheck:
      checks: ["all", "-SA1019"]
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Ignore protobuf generated files
      - path: "pkg/proto/"
        linters:
          - errcheck
          - govet
          - staticcheck
          - unused
      # Ignore test files for some linters
      - path: "_test\\.go"
        linters:
          - errcheck
    paths:
      - vendor
      - pkg/proto
