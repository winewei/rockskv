version: "2"

run:
  timeout: 5m
  go: "1.21"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  staticcheck:
    checks: ["all", "-SA1019"]

issues:
  exclude-rules:
    # Ignore error return in defer
    - linters:
        - errcheck
      source: "defer"

    # Ignore protobuf generated files
    - path: "pkg/proto/"
      linters:
        - all

    # Ignore test files for some linters
    - path: "_test\\.go"
      linters:
        - errcheck

  max-issues-per-linter: 50
  max-same-issues: 10

  exclude-dirs:
    - vendor
    - pkg/proto
