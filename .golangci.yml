run:
  timeout: 5m
  go: '1.21'

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - deadcode
    - structcheck
    - varcheck

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    check-shadowing: false
  staticcheck:
    checks: ["all", "-SA1019"]

issues:
  exclude-rules:
    # Ignore error return in defer
    - linters:
        - errcheck
      source: "defer"

    # Ignore protobuf generated files
    - path: "pkg/proto/"
      linters:
        - all

    # Ignore test files for some linters
    - path: "_test\\.go"
      linters:
        - errcheck
        - gosec

  # Maximum issues count per one linter
  max-issues-per-linter: 50

  # Maximum count of issues with the same text
  max-same-issues: 10

  # Don't report issues in auto-generated files
  exclude-dirs:
    - vendor
    - pkg/proto
