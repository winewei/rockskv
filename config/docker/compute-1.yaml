# Compute Node 1 Configuration - Docker Deployment
node_id: "compute-1"
listen_addr: ":8000"
metadata_addr: "metadata:9000"
metrics_addr: ":8090"

# Connection Pool Configuration
pool:
  max_conns_per_host: 10
  idle_timeout: "5m"
  dial_timeout: "5s"
  keep_alive_time: "10s"
  keep_alive_timeout: "5s"
