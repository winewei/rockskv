# Storage Node 3 Configuration - Local Development
node_id: "storage-3"
listen_addr: ":9003"
metadata_addr: "localhost:9000"
metrics_addr: ":9093"
sst_dir: "./data/sst3"

# RocksDB Configuration
rocksdb:
  data_dir: "./data/storage3"
  wal_dir: "./data/storage3/wal"
  block_cache_size: 268435456
  write_buffer_size: 33554432
  max_write_buffer_number: 2
  max_background_compactions: 2
  max_background_flushes: 1
  target_file_size_base: 33554432
  max_bytes_for_level_base: 134217728
  compression_type: "lz4"
