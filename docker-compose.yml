version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: rockskv-etcd
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  metadata:
    build:
      context: .
      dockerfile: deploy/Dockerfile.metadata
    container_name: rockskv-metadata
    ports:
      - "9000:9000"
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      - ROCKSKV_NODE_ID=metadata-1
      - ROCKSKV_LISTEN_ADDR=:9000
      - ROCKSKV_ETCD_ENDPOINTS=etcd:2379
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    build:
      context: .
      dockerfile: deploy/Dockerfile.storage
    container_name: rockskv-storage
    ports:
      - "9001:9001"
    depends_on:
      metadata:
        condition: service_healthy
    environment:
      - ROCKSKV_NODE_ID=storage-1
      - ROCKSKV_LISTEN_ADDR=:9001
      - ROCKSKV_METADATA_ADDR=metadata:9000
      - ROCKSKV_DATA_DIR=/data
      - ROCKSKV_WAL_DIR=/data/wal
      - ROCKSKV_SST_DIR=/data/sst
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9001"]
      interval: 10s
      timeout: 5s
      retries: 5

  compute:
    build:
      context: .
      dockerfile: deploy/Dockerfile.compute
    container_name: rockskv-compute
    ports:
      - "8000:8000"
    depends_on:
      metadata:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      - ROCKSKV_NODE_ID=compute-1
      - ROCKSKV_LISTEN_ADDR=:8000
      - ROCKSKV_METADATA_ADDR=metadata:9000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  etcd-data:
  storage-data:
